    <link rel="preload" as="style" href="http://localhost:8111/build/assets/app-B-vwGZPb.css" /><link rel="modulepreload" as="script" href="http://localhost:8111/build/assets/app-BMi1aT-M.js" /><link rel="stylesheet" href="http://localhost:8111/build/assets/app-B-vwGZPb.css" /><script type="module" src="http://localhost:8111/build/assets/app-BMi1aT-M.js"></script><script id="browser-logger-active">
(function() {
    const ENDPOINT = 'http://localhost:8111/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;
    const captureTypes = ["error","warning","info","log","debug","table"];

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        debug: console.debug,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Helper to safely stringify values
    function safeStringify(obj) {
        const seen = new WeakSet();
        return JSON.stringify(obj, (key, value) => {
            if (typeof value === 'object' && value !== null) {
                if (seen.has(value)) return '[Circular]';
                seen.add(value);
            }
            if (value instanceof Error) {
                return {
                    name: value.name,
                    message: value.message,
                    stack: value.stack
                };
            }
            return value;
        });
    }

    // Normalize log type for consistency (e.g., 'warn' to 'warning')
    function normalizeType(type) {
        return type === 'warn' ? 'warning' : type;
    }

    // Determine if a log type should be captured based on configured levels
    function shouldCapture(type) {
        return captureTypes.includes(normalizeType(type));
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'debug', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                if (!shouldCapture(method)) {
                    return;
                }

                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            if (shouldCapture('error')) {
                logQueue.push({
                    type: 'uncaught_error',
                    timestamp: new Date().toISOString(),
                    data: [{
                        message: errorMsg,
                        filename: url,
                        lineno: lineNumber,
                        colno: colNumber,
                        error: error ? {
                            name: error.name,
                            message: error.message,
                            stack: error.stack
                        } : null
                    }],
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            }

        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            if (!shouldCapture('error')) {
                return false;
            }

            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: event.reason instanceof Error ? {
                        name: event.reason.name,
                        message: event.reason.message,
                        stack: event.reason.stack
                    } : event.reason
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
})();

    <script>
    async function testDbConnection() {
        const resultEl = document.getElementById('connectionResult');
        const btn = document.getElementById('testBtn');

        // Validate required fields before testing
        const host = document.getElementById('host').value.trim();
        const port = document.getElementById('port').value.trim();
        const database = document.getElementById('database').value.trim();
        const username = document.getElementById('username').value.trim();

        if (!host || !port || !database || !username) {
            resultEl.textContent = '\u2717 Please fill in all fields (Host, Port, Database, Username)';
            resultEl.className = 'text-sm text-red-600 dark:text-red-400';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Testing...';
        resultEl.textContent = '';
        resultEl.className = 'text-sm text-muted-foreground';

        const data = { driver: document.querySelector('input[name=driver]:checked').value };
        document.querySelectorAll('#databaseForm input:not([disabled]):not([type=radio])').forEach(el => {
            if (el.name) data[el.name] = el.value;
        });

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s frontend timeout

            const res = await fetch('http://localhost:8111/setup/test-connection', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': '4JK2aXkEkxWXaj3naplBLQ4TAQ3dhYWfIPnViP7W',
                    'Accept': 'application/json',
                },
                body: JSON.stringify(data),
                signal: controller.signal,
            });

            clearTimeout(timeoutId);

            if (!res.ok) {
                resultEl.textContent = '\u2717 Server returned HTTP ' + res.status;
                resultEl.className = 'text-sm text-red-600 dark:text-red-400';
                return;
            }

            const json = await res.json();
            if (json.success) {
                if (json.has_data) {
                    resultEl.innerHTML = '\u26A0\uFE0F ' + json.message;
                    resultEl.className = 'text-sm text-amber-600 dark:text-amber-400';
                } else {
                    resultEl.textContent = '\u2713 ' + json.message;
                    resultEl.className = 'text-sm text-green-600 dark:text-green-400';
                }
            } else {
                resultEl.textContent = '\u2717 ' + json.message;
                resultEl.className = 'text-sm text-red-600 dark:text-red-400';
            }
        } catch (e) {
            if (e.name === 'AbortError') {
                resultEl.textContent = '\u2717 Connection timed out (10s). Server may be unreachable.';
            } else {
                resultEl.textContent = '\u2717 Network error: ' + e.message;
            }
            resultEl.className = 'text-sm text-red-600 dark:text-red-400';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="size-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg> Test Connection';
        }
    }
</script>
